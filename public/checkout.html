<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Aura Commerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-zinc-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-zinc-900 text-white flex items-center justify-center font-bold text-lg">A</div>
        <span class="font-bold text-lg tracking-tight">AURA CHECKOUT</span>
      </a>
      <span class="text-xs text-zinc-500 font-mono flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 256-Bit SSL Encrypted
      </span>
    </div>
  </header>

  <!-- Main Checkout Grid -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
      
      <!-- Checkout Form -->
      <div class="lg:col-span-7 space-y-8">
        
        <!-- Contact Information -->
        <section class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm space-y-4">
          <h2 class="text-base font-bold text-zinc-900 flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-zinc-900 text-white text-xs flex items-center justify-center font-mono">1</span>
            Contact Information
          </h2>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-medium text-zinc-700 mb-1">Email address</label>
              <input type="email" id="checkout-email" value="alex@example.com" class="w-full px-3 py-2 text-sm border border-zinc-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-zinc-900" data-testid="checkout-email" required>
            </div>
          </div>
        </section>

        <!-- Shipping Address -->
        <section class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm space-y-4">
          <h2 class="text-base font-bold text-zinc-900 flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-zinc-900 text-white text-xs flex items-center justify-center font-mono">2</span>
            Shipping Address
          </h2>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-zinc-700 mb-1">First name</label>
              <input type="text" id="checkout-firstname" value="Alex" class="w-full px-3 py-2 text-sm border border-zinc-300 rounded-lg" data-testid="checkout-firstname">
            </div>
            <div>
              <label class="block text-xs font-medium text-zinc-700 mb-1">Last name</label>
              <input type="text" id="checkout-lastname" value="Rivers" class="w-full px-3 py-2 text-sm border border-zinc-300 rounded-lg" data-testid="checkout-lastname">
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-medium text-zinc-700 mb-1">Street address</label>
              <input type="text" id="checkout-address" value="500 Market St, Suite 400" class="w-full px-3 py-2 text-sm border border-zinc-300 rounded-lg" data-testid="checkout-address">
            </div>
            <div>
              <label class="block text-xs font-medium text-zinc-700 mb-1">City</label>
              <input type="text" id="checkout-city" value="San Francisco" class="w-full px-3 py-2 text-sm border border-zinc-300 rounded-lg" data-testid="checkout-city">
            </div>
            <div>
              <label class="block text-xs font-medium text-zinc-700 mb-1">Postal Code</label>
              <input type="text" id="checkout-zip" value="94105" class="w-full px-3 py-2 text-sm border border-zinc-300 rounded-lg" data-testid="checkout-zip">
            </div>
          </div>
        </section>

        <!-- Payment -->
        <section class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm space-y-4">
          <h2 class="text-base font-bold text-zinc-900 flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-zinc-900 text-white text-xs flex items-center justify-center font-mono">3</span>
            Payment Method
          </h2>
          <div class="space-y-3">
            <div class="p-4 border-2 border-zinc-900 bg-zinc-50 rounded-lg flex items-center justify-between">
              <div class="flex items-center gap-3">
                <input type="radio" name="payment" checked class="text-zinc-900 focus:ring-zinc-900">
                <span class="text-sm font-semibold text-zinc-900">Credit Card (Test Mode)</span>
              </div>
              <span class="text-xs font-mono text-zinc-500">4242 •••• •••• 4242</span>
            </div>
          </div>
        </section>

        <button onclick="
          localStorage.removeItem('aura_cart');
          localStorage.removeItem('aura_promo');
          window.location.href = '/confirmation.html';
        " class="w-full bg-zinc-900 hover:bg-zinc-800 text-white text-base font-bold py-4 rounded-xl shadow-lg transition" data-testid="place-order-btn">
          Place Order
        </button>
      </div>

      <!-- Order Summary Column -->
      <div class="lg:col-span-5">
        <div class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm sticky top-6 space-y-6">
          <h3 class="font-bold text-lg text-zinc-900 border-b border-zinc-100 pb-3">Order Summary</h3>
          
          <div id="checkout-items-list" class="space-y-3 divide-y divide-zinc-100 text-sm"></div>

          <!-- Price Calculations -->
          <div class="space-y-2 text-sm pt-4 border-t border-zinc-200">
            <div class="flex justify-between text-zinc-600">
              <span>Subtotal</span>
              <span class="font-mono" id="checkout-subtotal" data-testid="checkout-subtotal">$0.00</span>
            </div>
            <div id="checkout-discount-row" class="hidden flex justify-between text-emerald-600 font-medium">
              <span>Promo Discount</span>
              <span class="font-mono" id="checkout-discount" data-testid="checkout-discount">-$0.00</span>
            </div>
            <div class="flex justify-between text-zinc-600">
              <span>Shipping</span>
              <span class="font-mono" id="checkout-shipping" data-testid="checkout-shipping">$0.00</span>
            </div>
            <div class="flex justify-between text-zinc-600">
              <span>Sales Tax (8.25%)</span>
              <span class="font-mono" id="checkout-tax" data-testid="checkout-tax">$0.00</span>
            </div>
            <div class="flex justify-between text-lg font-bold text-zinc-900 pt-3 border-t border-zinc-200">
              <span>Total Due</span>
              <span class="font-mono" id="checkout-total" data-testid="checkout-total">$0.00</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    // Populate checkout summary
    const totals = window.store.calculateTotals();
    const itemsList = document.getElementById("checkout-items-list");
    if (itemsList) {
      itemsList.innerHTML = window.store.cart.map(item => `
        <div class="flex items-center justify-between py-2">
          <div class="flex items-center gap-3">
            <img src="${item.image}" class="w-12 h-12 object-cover rounded bg-zinc-100" />
            <div>
              <p class="font-semibold text-zinc-900 text-xs">${item.name}</p>
              <p class="text-zinc-500 text-[11px] font-mono">Qty: ${item.quantity} &times; $${item.price.toFixed(2)}</p>
            </div>
          </div>
          <span class="font-mono font-medium text-xs">$${(item.price * item.quantity).toFixed(2)}</span>
        </div>
      `).join("");
    }
    
    document.getElementById("checkout-subtotal").textContent = `$${totals.subtotal}`;
    if (parseFloat(totals.discount) > 0) {
      const discRow = document.getElementById("checkout-discount-row");
      discRow.classList.remove("hidden");
      document.getElementById("checkout-discount").textContent = `-$${totals.discount}`;
    }
    document.getElementById("checkout-shipping").textContent = totals.isFreeShipping ? "FREE" : `$${totals.shipping}`;
    document.getElementById("checkout-tax").textContent = `$${totals.tax}`;
    document.getElementById("checkout-total").textContent = `$${totals.total}`;
  </script>
</body>
</html>
