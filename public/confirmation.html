<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | Aura Commerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen flex flex-col justify-center items-center p-4 antialiased">

  <div class="max-w-md w-full bg-white rounded-2xl border border-zinc-200 p-8 text-center shadow-lg space-y-6" data-testid="confirmation-card">
    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <div>
      <span class="text-xs font-mono font-semibold uppercase text-emerald-600 tracking-wider">Order Verified & Confirmed</span>
      <h1 class="text-2xl font-bold text-zinc-900 mt-1">Thank you for your order!</h1>
      <p class="text-xs text-zinc-500 mt-2">A confirmation email has been sent to your inbox.</p>
    </div>

    <div class="bg-zinc-50 p-4 rounded-xl text-left border border-zinc-100 text-xs space-y-2">
      <div class="flex justify-between">
        <span class="text-zinc-500">Order Reference:</span>
        <span class="font-mono font-semibold text-zinc-900" id="order-ref">AUR-94821</span>
      </div>
      <div class="flex justify-between">
        <span class="text-zinc-500">Status:</span>
        <span class="font-medium text-emerald-600">Processing</span>
      </div>
    </div>

    <a href="/" class="block w-full bg-zinc-900 hover:bg-zinc-800 text-white font-semibold py-3 rounded-lg text-sm transition shadow" data-testid="continue-shopping-btn">
      Continue Shopping &rarr;
    </a>
  </div>

  <script>
    document.getElementById("order-ref").textContent = "AUR-" + Math.floor(10000 + Math.random() * 90000);
  </script>
</body>
</html>
